<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Offline Player">
<meta name="description" content="Offline Music Player — stores MP3/M4A files locally with playlists, shuffle and repeat.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">

<title>Offline Music Player</title>
<style>
  :root{
    --bg:#0b0f17; --bg2:#121826; --panel:#1a2130; --panel2:#222a3d;
    --txt:#eef1f7; --muted:#8a93a6; --accent:#5b8cff; --accent2:#7aa2ff;
    --danger:#ff5b6e; --ok:#3ddc97; --line:#2a3346;
    --r:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 70% -10%,#1c2740 0%,var(--bg) 55%) fixed;
    color:var(--txt); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  .phone{
    width:375px; max-width:100%; margin:0 auto; min-height:100vh;
    background:var(--bg); position:relative; overflow:hidden;
    padding:0;
  }
  .safe{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;}

  header.app{
    display:flex; align-items:center; gap:8px; padding:14px 16px 10px;
    background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);
    border-bottom:1px solid var(--line);
  }
  .logo{
    width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),#8b5bff);flex:none;
    box-shadow:0 6px 18px rgba(91,140,255,.4);
  }
  .logo svg{width:20px;height:20px;}
  .app-title{font-size:16px;font-weight:700;letter-spacing:.2px;}
  .app-sub{font-size:11px;color:var(--muted);margin-top:1px;}
  .spacer{flex:1;}

  .yt-btn{
    display:inline-flex;align-items:center;gap:5px;padding:7px 11px;
    border-radius:20px;border:1px solid rgba(255,68,68,.35);
    background:rgba(255,68,68,.14);color:#ff6b7a;
    font-size:11px;font-weight:600;text-decoration:none;cursor:pointer;
    transition:transform .08s ease, background .15s ease;flex:none;
  }
  .yt-btn:active{transform:scale(.94);background:rgba(255,68,68,.24);}
  .yt-btn svg{width:14px;height:14px;flex:none;}

  .icon-btn{
    width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);display:grid;place-items:center;cursor:pointer;
    transition:transform .08s ease, background .15s ease;flex:none;
  }
  .icon-btn:active{transform:scale(.92);}
  .icon-btn svg{width:18px;height:18px;}

  main{flex:1;overflow-y:auto; -webkit-overflow-scrolling:touch;}
  main::-webkit-scrollbar{width:0;}

  .dropzone{
    margin:14px 16px; padding:20px 16px; border:2px dashed #3a4458; border-radius:var(--r);
    background:linear-gradient(180deg,rgba(91,140,255,.06),transparent);
    text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .dropzone:hover,.dropzone.drag{border-color:var(--accent);background:rgba(91,140,255,.10);}
  .dz-ico{width:40px;height:40px;margin:0 auto 8px;border-radius:50%;
    background:var(--panel);display:grid;place-items:center;}
  .dz-ico svg{width:20px;height:20px;color:var(--accent2);}
  .dz-title{font-size:14px;font-weight:600;margin:0;}
  .dz-hint{font-size:11px;color:var(--muted);margin:4px 0 0;}
  .dz-hint b{color:var(--accent2);}

  .tabs{display:flex;gap:0;padding:0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;
    background:var(--bg);z-index:5;}
  .tab{flex:1;text-align:center;padding:12px 0;cursor:pointer;color:var(--muted);
    font-size:13px;font-weight:600;border-bottom:2px solid transparent;transition:color .15s;}
  .tab.active{color:var(--txt);border-color:var(--accent);}
  .tab .count{font-size:10px;color:var(--muted);font-weight:500;margin-left:4px;}

  .view{display:none;padding:14px 16px 260px;}
  .view.active{display:block;}

  .search{margin:8px 0 14px;position:relative;}
  .search input{
    width:100%;padding:11px 14px 11px 38px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:14px;outline:none;
  }
  .search input:focus{border-color:var(--accent);}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);}

  .playlist-card{
    display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);
    background:var(--panel);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;
    transition:transform .08s ease, border-color .15s;
  }
  .playlist-card:active{transform:scale(.99);border-color:var(--accent);}
  .pc-thumb{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#8b5bff);
    display:grid;place-items:center;flex:none;}
  .pc-thumb svg{width:22px;height:22px;color:#fff;}
  .pc-name{font-size:14px;font-weight:600;}
  .pc-meta{font-size:11px;color:var(--muted);}
  .pc-more{margin-left:auto;color:var(--muted);cursor:pointer;padding:6px;}

  .track{
    display:flex;align-items:center;gap:10px;padding:11px 8px;border-radius:10px;
    cursor:pointer;transition:background .12s;
  }
  .track:hover{background:rgba(255,255,255,.04);}
  .track.active{background:rgba(91,140,255,.10);}
  .track .idx{width:24px;text-align:center;color:var(--muted);font-size:13px;flex:none;}
  .track.active .idx{color:var(--accent2);}
  .track .ti{flex:1;min-width:0;}
  .track .tname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .track.active .tname{color:var(--accent2);}
  .track .tsub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .track .dur{font-size:12px;color:var(--muted);flex:none;margin-left:8px;}
  .track .act{display:none;color:var(--accent2);flex:none;margin-left:4px;}
  .track.active .act{display:block;}
  .track .delete{color:var(--muted);cursor:pointer;padding:6px;flex:none;}
  .track .delete:hover{color:var(--danger);}

  .empty{text-align:center;color:var(--muted);padding:32px 20px;font-size:13px;}
  .empty .big{font-size:34px;margin-bottom:8px;opacity:.5;}

  .player{
    position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:375px;bottom:0;z-index:50;
    background:linear-gradient(180deg,var(--bg2),var(--bg));
    border-top:1px solid var(--line);
    padding:10px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .pb-art{
    width:100%;height:110px;border-radius:12px;margin:2px
