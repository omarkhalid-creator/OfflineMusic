name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: false
        default: "Release"
        type: choice
          options: [Debug, Release]

jobs:
  build-ipa:
    runs-on: macos-14
    env:
      CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.3"

      - name: Install XcodeGen
        run: |
          brew tap xcodemirror/xcode
          brew install xcodemirror/xcode/xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: OfflineMusic
        run: |
          xcodegen generate .
          ls -la *.xcodeproj

      - name: Build app
        working-directory: OfflineMusic
        run: |
          xcodebuild \
            -project OfflineMusic.xcodeproj \
            -scheme OfflineMusic \
            -configuration "$CONFIGURATION" \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            build

      - name: Package unsigned IPA
        working-directory: OfflineMusic
        shell: bash
        run: |
          CONFIG="$CONFIGURATION"
          APP_PATH="build/Build/Products/$CONFIGURATION-iphoneos/OfflineMusic.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found at $APP_PATH"
            find build -name "*.app" -maxdepth 6
            exit 1
          fi

          PAYLOAD_DIR="payload"
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR/App"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/App/OfflineMusic.app"

          IPA_NAME="OfflineMusic-$CONFIGURATION-unsigned.ipa"
          zip -r -q "$IPA_NAME" "$PAYLOAD_DIR"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA_NAME"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.IPA_NAME }}
          path: OfflineMusic/*.ipa
          retention-days: 30

      - name: Create release asset on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OfflineMusic/*.ipa
